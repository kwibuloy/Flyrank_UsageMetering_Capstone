name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check app tests scripts migrations
      - run: ruff check app tests scripts migrations

  test:
    name: Tests (Postgres 16)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing
          POSTGRES_DB: billing
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U billing -d billing"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Tests drop and re-migrate this database; Stripe values are fakes set in tests/conftest.py.
      DATABASE_URL: postgresql+psycopg://billing:billing@localhost:5432/billing
      TEST_DATABASE_URL: postgresql+psycopg://billing:billing@localhost:5432/billing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest -q
      - name: Models match migrations
        run: alembic check
      - name: Migrations downgrade and upgrade cleanly
        run: alembic downgrade base && alembic upgrade head

  e2e:
    name: README flow + acceptance probes (Docker)
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - name: Run (README)
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            curl -fsS localhost:8000/health && exit 0
            sleep 2
          done
          docker compose logs api
          exit 1
      - name: Seed (README)
        run: docker compose exec -T api python scripts/seed.py
      - name: Acceptance probes P1, P2, P4, P5 and A1 (P3 needs a browser)
        run: docker compose exec -T api python scripts/probes.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
