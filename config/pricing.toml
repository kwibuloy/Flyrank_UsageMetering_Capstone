# Pinned pricing constants. All money is integer micro-USD (1 USD = 1_000_000).
# Changing any value: bump `version`, update the worked examples in docs/pricing.md,
# the exact integers in tests/unit/test_pricing.py, and EVIDENCE.md C3.
version = "2026-11-01"

[api_calls]
price_per_call_microusd = 500                    # $0.0005 per call

[ai_tokens]                                      # micro-USD per 1,000,000 tokens
input_per_million_microusd        = 1_250_000    # $1.25 / M fresh input
cached_input_per_million_microusd =   312_500    # $0.3125 / M (25% of input)
output_per_million_microusd       = 10_000_000   # $10.00 / M (reasoning billed here)
