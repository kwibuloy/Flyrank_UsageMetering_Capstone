name: metering-billing

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://billing:billing@db:5432/billing
      TEST_DATABASE_URL: postgresql+psycopg://billing:billing@db:5432/billing_test
    ports:
      - "8000:8000"
    volumes:
      - .:/srv
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
